[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rbg-profiler"
version = "0.1.0"
description = "SLA profiling tool for RBG inference workloads"
requires-python = ">=3.10"
dependencies = [
    "kubernetes>=28.1.0",
    "aiohttp>=3.9.0",
    "numpy>=1.24.0",
    "transformers>=4.40.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0", "pytest-mock>=3.10.0"]

[project.scripts]
rbg-profiler = "rbg_profiler.main:main"
