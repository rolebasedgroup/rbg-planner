apiVersion: inference-extension.rolebasedgroup.io/v1alpha1
kind: AutoScaler
metadata:
  name: sglang-pd-inference    # must match the RBG name
  namespace: inference
spec:
  scalingInterval: 180    # seconds between scaling decisions
  backend: sglang-oai     # inference engine backend (bench + metrics)

  # Scaling pattern
  pattern:
    # pdDisaggregated: Prefill/Decode disaggregated scaling (supported)
    # unified: Unified scaling (reserved, not yet implemented)
    pdDisaggregated:
      prefill:
        roleName: prefill
        maxReplicas: 10
        minReplicas: 1
      decode:
        roleName: decode
        maxReplicas: 10
        minReplicas: 1

  # Scaling engine type
  implementation:
    # dynamoPlanner: SLA-based planner derived from NVIDIA Dynamo
    dynamoPlanner:
      modelName: "Qwen/Qwen3-0.6B"

      # SLA targets
      sla:
        ttft: 200.0             # target TTFT in milliseconds
        itl: 20.0               # target ITL in milliseconds

      # Load prediction
      loadPredictor: arima       # arima | constant | prophet
      predictionWindow: 50       # data points in predictor window

      # Correction factors
      noCorrection: false        # disable SLA correction factors

      # Dry-run mode
      dryRun: false              # observe only, no actual scaling

      # Private registry credentials (applied to both profiling Job and planner Deployment)
      imagePullSecrets:
        - name: regcred          # Kubernetes secret for pulling images from private registries

      profiling:
        image: "ghcr.io/rolebasedgroup/rbg-profiler:latest"
        # modelSource mounts a PVC with pre-downloaded model weights and
        # tokenizer files. When omitted, the profiler falls back to
        # downloading the tokenizer from HuggingFace using modelName.
        modelSource:
          pvcName: "model-weights"
          modelPath: "deepseek-r1"
          mountPath: "/opt/model"

      # Metrics configuration
      metrics:
        metricSource: sglang
        port: 9091
