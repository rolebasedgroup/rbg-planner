---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "rbg-planner.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rbg-planner.labels" . | nindent 4 }}
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["create", "get", "update"]
